name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing key
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/.debug
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.debug/earferry-debug.keystore

      - name: Build and verify APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./android/build-apk.sh

      - name: Publish latest APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built automatically from commit $GITHUB_SHA. Share a YouTube link to EarFerry; authentication stays in the web app."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest android/build/earferry.apk --clobber
            gh release edit android-latest --title "EarFerry for Android (latest)" --notes "$notes"
          else
            gh release create android-latest android/build/earferry.apk --target "$GITHUB_SHA" --title "EarFerry for Android (latest)" --notes "$notes"
          fi
