name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "android/**"
      - ".github/workflows/android-release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc -b

      # Development Clerk key on purpose: a pk_live_ key refuses localhost, so
      # the production key blanks the page the smoke test then fails on.
      # PostHog stays unset so CI runs do not land in product analytics.
      - name: Build frontend
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL_DEVELOPMENT }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_DEVELOPMENT }}

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: Smoke test homepage
        run: bun run test:e2e

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # The preview is a convenience; production deployment is not. Without the
      # key configured this job reports success and explains itself, rather than
      # failing every pull request in the repository.
      - name: Check for the Convex preview key
        id: guard
        env:
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          if [ -z "${CONVEX_PREVIEW_DEPLOY_KEY:-}" ]; then
            echo 'CONVEX_PREVIEW_DEPLOY_KEY is not set, so no PR preview was built.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      # Creates or updates an isolated Convex backend named pr-<number> and
      # builds the frontend against it, so one PR can never overwrite another
      # PR's functions, schema or data. The preview backend inherits only the
      # project's preview default environment variables (the development Clerk
      # issuer), so it cannot reach the extractor or PostHog.
      - name: Deploy Convex preview + build frontend
        if: steps.guard.outputs.enabled == 'true'
        run: >-
          bunx convex deploy
          --preview-name "pr-${{ github.event.pull_request.number }}"
          --preview-run feeds:seedSampleFeed
          --cmd 'bash scripts/preview-build.sh'
          --cmd-url-env-var-name VITE_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_DEVELOPMENT }}

      # CONVEX_SITE_URL is written to GITHUB_ENV by scripts/preview-build.sh and
      # overrides the shared development origin in wrangler.dev.jsonc.
      - name: Upload PR preview
        if: steps.guard.outputs.enabled == 'true'
        run: >-
          bun run preview:upload --
          --preview-alias "pr-${{ github.event.pull_request.number }}"
          --var CONVEX_SITE_URL:"$CONVEX_SITE_URL"
          --tag "${GITHUB_SHA::9}"
          --message "PR #${{ github.event.pull_request.number }}: $(git log -1 --format=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The checks job runs these against `vite preview`, which serves only the
      # static bundle. Here they run against the real Worker and this PR's own
      # Convex backend, so routing, the /feed/* proxy and the feed itself are
      # covered. The preview cannot reach the extractor, so its seeded episodes
      # never become ready and the playable-audio test stays off.
      - name: End-to-end tests against the preview
        if: steps.guard.outputs.enabled == 'true'
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://pr-${{ github.event.pull_request.number }}-earferry.earferry.workers.dev

      - name: Publish preview URL
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-earferry.earferry.workers.dev
        run: |
          printf '### Cloudflare preview\n\n%s\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none \
            --body "Development preview: $PREVIEW_URL"

  deploy:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - name: Validate production configuration
        run: bun run validate:production
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}

      # Deploys Convex functions to production and builds the frontend with
      # the production VITE_CONVEX_URL injected by `convex deploy --cmd`.
      - name: Deploy Convex + build frontend
        run: bunx convex deploy --cmd 'bun run build' --cmd-url-env-var-name VITE_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}

      # --tag/--message make the version history show which commit is live.
      - name: Deploy frontend to Cloudflare
        run: >
          bunx wrangler deploy
          --tag "${GITHUB_SHA::9}"
          --message "$(git log -1 --format=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}

      # Production is the only origin that serves extracted audio, so this is
      # where the demo feed is checked end to end. EARFERRY_FEED_TOKEN is
      # optional; without it the private-feed test skips rather than fails.
      - name: Smoke test the live feeds
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: https://earferry.com
          EARFERRY_FEED_HAS_MEDIA: "1"
          EARFERRY_FEED_TOKEN: ${{ secrets.EARFERRY_FEED_TOKEN }}
